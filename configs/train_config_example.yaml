# 训练配置文件示例
# 使用方法：复制此文件并根据你的数据集修改

# ============== 数据配置 ==============
data:
  train_image_dir: "/path/to/your_dataset/train/images"
  train_mask_dir: "/path/to/your_dataset/train/masks"
  val_image_dir: "/path/to/your_dataset/val/images"
  val_mask_dir: "/path/to/your_dataset/val/masks"
  image_size: 256
  aug_intensity: "medium"  # low, medium, high

# ============== 模型配置 ==============
model:
  pretrained_path: null  # 如果有预训练权重，填写路径
  freeze_encoder: false  # 微调时建议设为true
  base_channels: 64

# ============== 训练参数 ==============
training:
  epochs: 100
  batch_size: 8
  num_workers: 4

  # 优化器
  lr: 0.0002  # 2e-4
  weight_decay: 0.00001  # 1e-5

  # 学习率调度
  lr_decay_step: 30  # 每30个epoch衰减一次
  lr_decay_gamma: 0.5  # 衰减系数

# ============== 损失函数 ==============
loss:
  mask_weight: 5.0  # 裂缝区域损失权重

# ============== 保存配置 ==============
checkpoint:
  save_interval: 10  # 每10个epoch保存一次
  output_dir: "./experiments"
  exp_name: "pctnet_crack"

# ============== 其他 ==============
device: "cuda"
resume: null  # 恢复训练的checkpoint路径
